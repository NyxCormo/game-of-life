<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game of Life</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        background-color: #0b0d10;
        font-family: system-ui, sans-serif;
      }

      #board {
        max-width: 100%;
        image-rendering: pixelated;
        touch-action: none;
        cursor: crosshair;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .controls button {
        min-width: 80px;
        padding: 6px 12px;
        border: 1px solid #2a3038;
        border-radius: 6px;
        background-color: #1a1f25;
        color: #e5e7eb;
        font: inherit;
        cursor: pointer;
      }

      .controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div class="controls">
      <button id="play-button" type="button">Pause</button>
      <button id="step-button" type="button">Step</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
