<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game of Life</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        background-color: #0b0d10;
        font-family: system-ui, sans-serif;
      }

      #board {
        max-width: 100%;
        max-height: 75vh;
        image-rendering: pixelated;
        touch-action: none;
        cursor: crosshair;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
        color: #e5e7eb;
      }

      .controls button,
      .controls select {
        min-width: 80px;
        padding: 6px 12px;
        border: 1px solid #2a3038;
        border-radius: 6px;
        background-color: #1a1f25;
        color: #e5e7eb;
        font: inherit;
        cursor: pointer;
      }

      .controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .controls label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .controls input[type='number'] {
        width: 64px;
        padding: 6px 8px;
        border: 1px solid #2a3038;
        border-radius: 6px;
        background-color: #1a1f25;
        color: #e5e7eb;
        font: inherit;
      }

      .controls input[type='range'],
      .controls input[type='checkbox'] {
        accent-color: #4ade80;
      }

      .controls output {
        min-width: 64px;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div class="controls">
      <button id="play-button" type="button">Pause</button>
      <button id="step-button" type="button">Step</button>
      <label>
        Speed:
        <input id="speed-input" type="range" min="1" max="60" />
        <output id="speed-value" for="speed-input"></output>
      </label>
    </div>
    <div class="controls">
      <button id="clear-button" type="button">Clear</button>
      <button id="random-button" type="button">Random</button>
      <label>
        Size:
        <input id="width-input" type="number" step="1" />
        x
        <input id="height-input" type="number" step="1" />
      </label>
    </div>
    <div class="controls">
      <label>
        Edges:
        <select id="edge-select">
          <option value="wrap">Wrapped</option>
          <option value="dead">Dead</option>
        </select>
      </label>
      <label>
        Margin:
        <input id="margin-input" type="range" min="0" />
        <output id="margin-value" for="margin-input"></output>
      </label>
      <label>
        <input id="show-margin-input" type="checkbox" />
        Show margin
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
